<!-- RayClay: Lucide's circle-alert mark alone, without its circle, scaled 1.5x
     about the center: the bare "!" a round status badge carries, as it carries
     check and minus bare (ex27). Inside a badge the circle would draw a ring in
     a ring. -->
<svg
  class="lucide lucide-circle-alert"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <line x1="12" x2="12" y1="6" y2="12" />
  <line x1="12" x2="12.015" y1="18" y2="18" />
</svg>
